name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked
      - name: Verify protocol engine lock pin
        run: grep -F 'git+https://github.com/ayourtch-llm/opendrop-rs.git?rev=dccc798e244363eb92d35e3c52e9a913188dda91#dccc798e244363eb92d35e3c52e9a913188dda91' Cargo.lock

  plugin-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest shape
        run: |
          jq -e '
            .schemaVersion == 1 and
            .id == "io.github.akitwra.omarchy-drop" and
            (.id | startswith("omarchy.") | not) and
            (.kinds | index("bar-widget") != null) and
            .entryPoints.barWidget == "Panel.qml"
          ' manifest.json

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate installer scripts
        run: |
          test -x install.sh
          test -x uninstall.sh
          bash -n install.sh uninstall.sh packaging/PKGBUILD
      - name: Validate commit-pinned package source
        env:
          OMDROP_COMMIT: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          source packaging/PKGBUILD
          [[ ${source[0]} == *"#commit=$OMDROP_COMMIT" ]]
          [[ ${source[1]} == *"#commit=dccc798e244363eb92d35e3c52e9a913188dda91" ]]
          [[ ${source[1]} != *"#branch="* ]]
