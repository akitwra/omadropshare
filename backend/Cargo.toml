[workspace]
resolver = "2"
members = [
  "crates/omdrop-core",
  "crates/omdrop-airdrop",
  "crates/omdrop-awdl",
  "crates/omdrop-ble",
  "crates/omdrop-platform-linux",
  "crates/omdrop-daemon",
  "crates/omdrop-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-only"
repository = "https://github.com/akitwra/omadropshare"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
